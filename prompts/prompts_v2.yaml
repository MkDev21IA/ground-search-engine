  prompt: "What is the current empirical status of the Hubble Tension in 2025/2026? Detail the discrepancy between late-universe measurements (JWST/SH0ES) and early-universe Planck CMB measurements, citing specific tension values in km/s/Mpc and the main proposed cosmological resolutions."
  lang: en
  notes: "Contested physics debate requiring exact numerical discrepancies and competing theoretical models."

