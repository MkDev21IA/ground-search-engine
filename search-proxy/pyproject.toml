[project]
name = "ground-search-engine"
version = "0.1.0"
description = "Grounded search engine and factual synthesis pipeline with verified sources."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "trafilatura>=2.0",
    "readability-lxml>=0.8",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["search_proxy*"]
